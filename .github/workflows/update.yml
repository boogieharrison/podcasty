name: Zbierz odcinki i opublikuj stronę

on:
  schedule:
    - cron: '17 * * * *' # co godzinę
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pobierz odcinki
        run: node scripts/fetch.mjs

      - name: Zapisz dane w repozytorium
        run: |
          git config user.name "podcasty-bot"
          git config user.email "podcasty-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Aktualizacja odcinków"
          git push

      - name: Przygotuj stronę
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
