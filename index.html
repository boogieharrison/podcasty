<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14161a">
<title>Podcasty</title>
<style>
:root {
  --bg: #14161a;
  --panel: #1c1f25;
  --line: #2c313a;
  --text: #e8e6e1;
  --muted: #a3a7b0;
  --accent: #e0b460;
  --accent-ink: #1a1508;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-wrap: wrap; align-items: flex-start; max-width: 1180px; margin: 0 auto; }
.side { flex: 1 1 240px; max-width: 100%; padding: 28px 20px; display: flex; flex-direction: column; gap: 28px; }
.main { flex: 999 1 560px; min-width: 0; padding: 28px 20px 64px; display: flex; flex-direction: column; gap: 28px; }
@media (min-width: 860px) { .side { position: sticky; top: 0; } }

h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }

.tabs { display: flex; flex-direction: column; gap: 4px; }
.tab {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  min-height: 44px; padding: 0 12px; text-align: left;
  background: none; border: 1px solid transparent; border-radius: 8px;
}
.tab:hover { background: var(--panel); }
.tab[aria-pressed="true"] { background: var(--panel); border-color: var(--line); font-weight: 600; }
.tab .count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.group { display: flex; flex-direction: column; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 15px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.minrow { display: flex; align-items: center; gap: 8px; font-size: 14px; white-space: nowrap; }
.minrow input[type="number"] {
  width: 56px; height: 36px; padding: 0 8px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
}
.hint { font-size: 13px; color: var(--muted); margin: 0; }

.player { display: none; flex-direction: column; gap: 14px; }
.player.on { display: flex; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
.frame > div, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.now { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.now-title { font-size: 18px; font-weight: 650; margin: 0; }
.meta { font-size: 14px; color: var(--muted); margin: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 14px; border-radius: 8px; text-decoration: none;
  background: var(--panel); border: 1px solid var(--line); font-size: 14px; font-weight: 550; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.icon { width: 44px; padding: 0; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.list { list-style: none; margin: 0; padding: 0; }
.ep { display: flex; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
/* Stała szerokość i min-width: 0 – inaczej Safari rozciąga miniaturę do jej naturalnych 320 px */
.thumb { flex: none; width: 144px; min-width: 0; height: auto; aspect-ratio: 16 / 9; border-radius: 8px; background: var(--panel); object-fit: cover; }
.ep-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ep-title { margin: 0; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
.bar { height: 3px; width: 100%; max-width: 220px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.ep .actions { flex: 0 0 auto; }
.end { padding: 44px 0 0; text-align: center; }
.end strong { display: block; font-size: 16px; }

/* Telefon: odtwarzamy tylko w aplikacji YouTube – osadzony odtwarzacz w Safari
   nie widzi zalogowania (reklamy, bez Premium, bez postępu w YouTube) */
@media (max-width: 720px) {
  .side { padding-bottom: 0; gap: 16px; }
  .tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tab { justify-content: center; border-color: var(--line); gap: 8px; }
  .ep { flex-wrap: wrap; align-items: flex-start; }
  .thumb { width: 112px; }
  .ep-body { flex-basis: 0; }
  .ep .actions { flex: 1 1 100%; }
  .ep .actions .yt { order: -1; flex: 1 1 auto; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ep .actions .play { display: none; }
}
.add { display: flex; gap: 8px; }
.field {
  flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
}
.hint a { color: var(--accent); }
details summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
details[open] summary { margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app">

<aside class="side">
  <h1>Podcasty</h1>

  <nav class="tabs" aria-label="Filtry" id="tabs"></nav>

  <details id="settings">
    <summary class="label">Kanały i filtry</summary>
    <div class="group" id="channels"></div>
    <div class="group" style="margin-top:20px">
      <label class="minrow">Ukryj krótsze niż
        <input type="number" id="minMin" min="0" max="240" step="1" inputmode="numeric"> min
      </label>
      <p class="hint" id="updated"></p>
    </div>
    <div class="group" id="sync" style="margin-top:20px"></div>
  </details>
</aside>

<main class="main">
  <section class="player" id="player" aria-label="Odtwarzacz">
    <div class="frame"><div id="yt"></div></div>
    <div class="now">
      <div>
        <p class="now-title" id="nowTitle"></p>
        <p class="meta" id="nowMeta"></p>
      </div>
      <div class="actions">
        <button class="btn primary" id="nowDone">Odsłuchane</button>
        <button class="btn" id="nowClose">Zamknij</button>
      </div>
    </div>
  </section>

  <section class="group" aria-label="Dodaj odcinek">
    <form class="add" id="addForm">
      <input class="field" type="url" id="addUrl" placeholder="Link do odcinka z YouTube" aria-label="Link do odcinka" autocomplete="off">
      <button class="btn" type="submit">Dodaj</button>
    </form>
    <p class="hint" id="addMsg" aria-live="polite"></p>
  </section>

  <section aria-label="Lista odcinków">
    <div class="list-head">
      <span class="label" id="listTitle"></span>
    </div>
    <ul class="list" id="list"></ul>
    <div class="end" id="end"></div>
  </section>
</main>

</div>

<script>
(() => {
  const TABS = [
    { id: 'new', name: 'Nowe', empty: 'Nie ma nowych odcinków.' },
    { id: 'progress', name: 'W trakcie', empty: 'Nic nie jest zaczęte.' },
    { id: 'later', name: 'Na później', empty: 'Nic nie odłożono na później.' },
    { id: 'done', name: 'Odsłuchane', empty: 'Jeszcze nic nie odsłuchano.' },
  ];
  const KEY = 'podcasty.v1';
  const phone = window.matchMedia('(max-width: 720px)').matches;
  const $ = (id) => document.getElementById(id);

  // ---- stan zapisany w tej przeglądarce ----
  // t: kiedy zmienił się stan odcinka (do scalania między urządzeniami),
  // extras: pojedyncze odcinki dodane z linku
  let state = { marks: {}, pos: {}, t: {}, extras: {}, off: [], minMin: 10, settingsT: 0, tab: 'new' };
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved) state = { ...state, ...saved };
  } catch {}
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  };

  const EXTRA = 'extra'; // umowny kanał dla pojedynczych odcinków

  let data = { updatedAt: null, channels: [], episodes: [] };
  let loaded = false;
  let current = null; // id odtwarzanego odcinka
  let player = null;
  let ticker = null;

  const el = (tagName, props = {}, children = []) => {
    const node = document.createElement(tagName);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'text') node.textContent = v;
      else if (k === 'on') for (const [ev, fn] of Object.entries(v)) node.addEventListener(ev, fn);
      else if (v !== null && v !== undefined) node.setAttribute(k, v);
    }
    for (const c of [].concat(children)) if (c) node.append(c);
    return node;
  };

  const svg = (d) =>
    `<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
  const ICON = { check: 'M3 9.5l4 4 8-9', later: 'M5 3h8v12l-4-3-4 3z', undo: 'M4 7h7a4 4 0 010 8H7M4 7l3-3M4 7l3 3', remove: 'M4 4l10 10M14 4L4 14' };

  const fmtDuration = (s) => {
    if (!s) return null;
    const m = Math.round(s / 60);
    return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min` : `${m} min`;
  };
  const rtf = new Intl.RelativeTimeFormat('pl', { numeric: 'auto' });
  const fmtDate = (iso) => {
    const then = new Date(iso);
    const days = Math.round((startOfDay(then) - startOfDay(new Date())) / 864e5);
    if (days > -7) return rtf.format(days, 'day');
    return then.toLocaleDateString('pl', { day: 'numeric', month: 'short', year: 'numeric' });
  };
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();

  const channelName = (key) => (data.channels.find((c) => c.key === key) || {}).title || '';
  const metaOf = (e) =>
    (e.channel === EXTRA
      ? [e.author, 'dodano ' + fmtDate(e.published)]
      : [channelName(e.channel), fmtDate(e.published), fmtDuration(e.duration)]
    ).filter(Boolean).join(' · ');

  const episodes = () => {
    const have = new Set(data.episodes.map((e) => e.id));
    const extra = Object.entries(state.extras)
      .filter(([id, x]) => !x.removed && !have.has(id))
      .map(([id, x]) => ({
        id, title: x.title, author: x.author, channel: EXTRA,
        published: new Date(x.added).toISOString(), duration: null,
      }));
    return [...data.episodes, ...extra].sort((a, b) => b.published.localeCompare(a.published));
  };

  const statusOf = (e) => {
    const mark = state.marks[e.id];
    if (mark === 'done') return 'done';
    if (mark === 'later') return 'later';
    if (state.pos[e.id] > 15) return 'progress';
    return 'new';
  };

  const visible = () =>
    episodes().filter((e) => {
      if (state.off.includes(e.channel)) return false;
      if (e.duration && e.duration < state.minMin * 60) return false;
      return true;
    });

  // ---- akcje ----
  const setMark = (id, mark) => {
    if (mark) state.marks[id] = mark;
    else delete state.marks[id];
    if (mark === 'done') delete state.pos[id];
    state.t[id] = Date.now();
    changed(1500);
    render();
  };

  const play = (e) => {
    current = e.id;
    $('player').classList.add('on');
    $('nowTitle').textContent = e.title;
    $('nowMeta').textContent = metaOf(e);
    const start = Math.max(0, Math.floor((state.pos[e.id] || 0) - 3));
    if (player && player.loadVideoById) {
      player.loadVideoById({ videoId: e.id, startSeconds: start });
    } else {
      pending = { id: e.id, start };
      loadApi();
    }
    $('player').scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  const closePlayer = () => {
    remember();
    if (player && player.stopVideo) player.stopVideo();
    current = null;
    $('player').classList.remove('on');
    render();
  };

  const remember = () => {
    if (!current || !player || !player.getCurrentTime) return;
    const t = player.getCurrentTime();
    if (t > 0 && state.marks[current] !== 'done') {
      state.pos[current] = Math.floor(t);
      state.t[current] = Date.now();
      changed(30000);
    }
  };

  // ---- odtwarzacz YouTube ----
  let pending = null;
  let apiRequested = false;
  const loadApi = () => {
    if (apiRequested) return;
    apiRequested = true;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.append(s);
  };
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('yt', {
      videoId: pending ? pending.id : undefined,
      playerVars: { autoplay: 1, rel: 0, playsinline: 1, start: pending ? pending.start : 0 },
      events: {
        onStateChange: (ev) => {
          if (ev.data === YT.PlayerState.ENDED && current) {
            const id = current;
            current = null;
            $('player').classList.remove('on');
            setMark(id, 'done');
          }
        },
      },
    });
    ticker = setInterval(remember, 5000);
  };
  window.addEventListener('pagehide', remember);

  // ---- rysowanie ----
  const renderTabs = (eps) => {
    const counts = { new: 0, progress: 0, later: 0, done: 0 };
    for (const e of eps) counts[statusOf(e)] += 1;
    $('tabs').replaceChildren(
      ...TABS.map((t) =>
        el('button', {
          class: 'tab', 'aria-pressed': String(state.tab === t.id),
          on: { click: () => { state.tab = t.id; save(); render(); } },
        }, [el('span', { text: t.name }), el('span', { class: 'count', text: String(counts[t.id]) })]),
      ),
    );
  };

  const iconBtn = (label, icon, pressed, fn) => {
    const b = el('button', { class: 'btn icon', 'aria-label': label, title: label, on: { click: fn } });
    if (pressed !== null) b.setAttribute('aria-pressed', String(pressed));
    b.innerHTML = svg(ICON[icon]);
    return b;
  };

  const renderRow = (e) => {
    const st = statusOf(e);
    const pos = state.pos[e.id] || 0;
    const meta = metaOf(e);
    const body = el('div', { class: 'ep-body' }, [
      el('p', { class: 'ep-title', text: e.title }),
      el('p', { class: 'meta', text: meta }),
    ]);
    if (st === 'progress' && e.duration) {
      const bar = el('div', { class: 'bar', role: 'img', 'aria-label': `Odsłuchano ${Math.round((pos / e.duration) * 100)}%` });
      const fill = el('i');
      fill.style.width = Math.min(100, (pos / e.duration) * 100) + '%';
      bar.append(fill);
      body.append(bar);
    }
    const actions = el('div', { class: 'actions' }, [
      el('button', { class: 'btn primary play', text: st === 'progress' ? 'Wznów' : 'Odtwórz', on: { click: () => play(e) } }),
      // Bez &t= – aplikacja YouTube sama wznawia od miejsca zapisanego na koncie.
      // Na telefonie bez nowej karty, żeby link od razu otwierał aplikację.
      el('a', {
        class: 'btn yt', href: `https://www.youtube.com/watch?v=${e.id}`,
        target: phone ? null : '_blank', rel: 'noopener', text: 'W YouTube',
      }),
      st === 'done'
        ? iconBtn('Cofnij oznaczenie', 'undo', null, () => setMark(e.id, null))
        : iconBtn('Na później', 'later', st === 'later', () => setMark(e.id, st === 'later' ? null : 'later')),
      st === 'done' ? null : iconBtn('Oznacz jako odsłuchane', 'check', null, () => setMark(e.id, 'done')),
      e.channel === EXTRA ? iconBtn('Usuń z listy', 'remove', null, () => removeExtra(e.id)) : null,
    ]);
    return el('li', { class: 'ep' }, [
      el('img', { class: 'thumb', src: `https://i.ytimg.com/vi/${e.id}/mqdefault.jpg`, alt: '', loading: 'lazy' }),
      body,
      actions,
    ]);
  };

  const renderSettings = () => {
    const extras = Object.values(state.extras).some((x) => !x.removed)
      ? [{ key: EXTRA, title: 'Pojedyncze odcinki' }] : [];
    $('channels').replaceChildren(
      ...[...data.channels, ...extras].map((c) => {
        const box = el('input', { type: 'checkbox' });
        box.checked = !state.off.includes(c.key);
        box.addEventListener('change', () => {
          state.off = box.checked ? state.off.filter((k) => k !== c.key) : [...state.off, c.key];
          state.settingsT = Date.now();
          changed(1500);
          render();
        });
        return el('label', { class: 'check' }, [box, el('span', { text: c.title })]);
      }),
    );
    $('minMin').value = state.minMin;
    $('updated').textContent = data.updatedAt
      ? 'Ostatnie zbieranie: ' + new Date(data.updatedAt).toLocaleString('pl', { dateStyle: 'medium', timeStyle: 'short' })
      : '';
    renderSync();
  };

  const render = () => {
    const eps = visible();
    renderTabs(eps);
    const tab = TABS.find((t) => t.id === state.tab) || TABS[0];
    const rows = eps.filter((e) => statusOf(e) === tab.id);
    $('listTitle').textContent = tab.name;
    $('list').replaceChildren(...rows.map(renderRow));

    const end = $('end');
    if (!loaded) {
      end.replaceChildren(el('p', { class: 'meta', text: 'Wczytywanie…' }));
    } else if (!data.channels.length) {
      end.replaceChildren(
        el('strong', { text: 'Brak kanałów' }),
        el('p', { class: 'meta', text: 'Dodaj linki do kanałów w pliku channels.json w repozytorium. Odcinki pojawią się po najbliższym zbieraniu.' }),
      );
    } else if (!rows.length) {
      end.replaceChildren(el('strong', { text: tab.empty }));
    } else {
      end.replaceChildren(
        el('strong', { text: 'To wszystko' }),
        el('p', { class: 'meta', text: 'Lista kończy się tutaj.' }),
      );
    }
  };

  // ---- synchronizacja między urządzeniami (prywatny gist na GitHubie) ----
  // Każde urządzenie trzyma pełną kopię stanu; przy scalaniu wygrywa nowsza zmiana danego odcinka.
  const SYNC_KEY = 'podcasty.sync';
  const GIST_FILE = 'podcasty.json';
  let sync = null; // { token, gist }
  try { sync = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch {}
  let syncInfo = null; // { ok, at } albo { ok: false, msg }
  const saveSync = () => {
    try {
      if (sync) localStorage.setItem(SYNC_KEY, JSON.stringify(sync));
      else localStorage.removeItem(SYNC_KEY);
    } catch {}
  };

  // JSON z posortowanymi kluczami – ten sam stan zawsze daje ten sam tekst
  const canon = (v) =>
    JSON.stringify(v, (k, x) =>
      x && typeof x === 'object' && !Array.isArray(x)
        ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0)))
        : x);
  const shared = () => ({
    marks: state.marks, pos: state.pos, t: state.t, extras: state.extras,
    off: state.off, minMin: state.minMin, settingsT: state.settingsT,
  });

  const gh = async (path, opts = {}) => {
    const r = await fetch('https://api.github.com' + path, {
      cache: 'no-store',
      ...opts,
      headers: {
        authorization: `Bearer ${sync.token}`,
        accept: 'application/vnd.github+json',
        ...(opts.body ? { 'content-type': 'application/json' } : {}),
      },
    });
    if (r.status === 401) throw new Error('nieprawidłowy lub wygasły token');
    if (!r.ok) throw new Error(`błąd GitHuba (${r.status})`);
    return r.json();
  };

  const findGist = async () => {
    for (let page = 1; page <= 10; page++) {
      const list = await gh(`/gists?per_page=100&page=${page}`);
      const hit = list.find((g) => g.files && g.files[GIST_FILE]);
      if (hit) return hit.id;
      if (list.length < 100) break;
    }
    const g = await gh('/gists', {
      method: 'POST',
      body: JSON.stringify({ description: 'Podcasty – stan odsłuchu', public: false, files: { [GIST_FILE]: { content: '{}' } } }),
    });
    return g.id;
  };

  const merge = (r) => {
    if (!r || typeof r !== 'object') return;
    const rm = r.marks || {}, rp = r.pos || {}, rt = r.t || {};
    for (const id of new Set([...Object.keys(rm), ...Object.keys(rp), ...Object.keys(rt)])) {
      const localHas = id in state.marks || id in state.pos || id in state.t;
      if ((rt[id] || 0) > (state.t[id] || 0) || !localHas) {
        if (rm[id]) state.marks[id] = rm[id]; else delete state.marks[id];
        if (rp[id]) state.pos[id] = rp[id]; else delete state.pos[id];
        if (rt[id]) state.t[id] = rt[id];
      }
    }
    for (const [id, x] of Object.entries(r.extras || {})) {
      const l = state.extras[id];
      if (!l || (x.t || 0) > (l.t || 0)) state.extras[id] = x;
    }
    if ((r.settingsT || 0) > (state.settingsT || 0)) {
      state.off = r.off || [];
      state.minMin = r.minMin ?? state.minMin;
      state.settingsT = r.settingsT;
    }
    save();
  };

  // Zwraca tekst pliku w gieście (żeby porównać z naszym stanem)
  const pull = async () => {
    const g = await gh(`/gists/${sync.gist}`);
    const f = g.files && g.files[GIST_FILE];
    let text = '{}';
    if (f) text = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content || '{}';
    try { merge(JSON.parse(text)); } catch {}
    return text;
  };
  const pushNow = (keepalive = false) =>
    gh(`/gists/${sync.gist}`, {
      method: 'PATCH',
      keepalive,
      body: JSON.stringify({ files: { [GIST_FILE]: { content: canon(shared()) } } }),
    });

  let chain = Promise.resolve();
  const runSync = () => {
    if (!sync) return;
    chain = chain.then(async () => {
      if (!sync) return;
      try {
        if (!sync.gist) { sync.gist = await findGist(); saveSync(); }
        const remote = await pull();
        if (remote !== canon(shared())) await pushNow();
        syncInfo = { ok: true, at: Date.now() };
      } catch (err) {
        syncInfo = { ok: false, msg: err.message };
        // Pierwsze połączenie się nie udało – nie zostawiamy złego tokenu
        if (!sync.gist) { sync = null; saveSync(); }
      }
      renderSettings();
      render();
    });
  };

  let syncTimer = null;
  let syncDue = 0;
  // Zapis lokalny od razu, wysyłka po chwili (kilka zmian = jedna wysyłka)
  const changed = (delay) => {
    save();
    if (!sync) return;
    const due = Date.now() + delay;
    if (syncTimer && syncDue <= due) return;
    clearTimeout(syncTimer);
    syncDue = due;
    syncTimer = setTimeout(() => { syncTimer = null; runSync(); }, delay);
  };

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      remember();
      if (sync && sync.gist && syncTimer) {
        clearTimeout(syncTimer);
        syncTimer = null;
        pushNow(true).catch(() => {});
      }
    } else {
      runSync();
    }
  });
  setInterval(() => { if (!document.hidden) runSync(); }, 120000);

  const connect = (token) => {
    sync = { token: token.trim() };
    saveSync();
    syncInfo = { ok: true, msg: 'Łączenie…' };
    renderSync();
    runSync();
  };

  const renderSync = () => {
    const box = $('sync');
    const head = el('span', { class: 'label', text: 'Synchronizacja' });
    if (!sync) {
      const input = el('input', { class: 'field', type: 'password', placeholder: 'Token z GitHuba', 'aria-label': 'Token z GitHuba', autocomplete: 'off' });
      const intro = el('p', { class: 'hint' }, [
        'Stan odsłuchu i dodane odcinki mogą być wspólne dla wszystkich urządzeń. ',
        el('a', { href: 'https://github.com/settings/tokens/new?scopes=gist&description=Podcasty%20sync', target: '_blank', rel: 'noopener', text: 'Utwórz token' }),
        ' (wystarczy uprawnienie „gist”) i wklej go tutaj.',
      ]);
      const form = el('form', { class: 'add', on: { submit: (ev) => { ev.preventDefault(); if (input.value.trim()) connect(input.value); } } },
        [input, el('button', { class: 'btn', type: 'submit', text: 'Połącz' })]);
      box.replaceChildren(head, intro, form, syncInfo && !syncInfo.ok ? el('p', { class: 'hint', text: 'Nie udało się połączyć: ' + syncInfo.msg }) : null);
      return;
    }
    const status = !syncInfo || syncInfo.msg === 'Łączenie…'
      ? 'Łączenie…'
      : syncInfo.ok
        ? 'Włączona · ostatnio ' + new Date(syncInfo.at).toLocaleTimeString('pl', { hour: '2-digit', minute: '2-digit' })
        : 'Błąd: ' + syncInfo.msg;
    const msg = el('p', { class: 'hint', 'aria-live': 'polite' });
    const copy = el('button', {
      class: 'btn', type: 'button', text: 'Link dla innego urządzenia',
      on: {
        click: async () => {
          const link = `${location.origin}${location.pathname}#sync=${encodeURIComponent(sync.token)}`;
          try {
            await navigator.clipboard.writeText(link);
            msg.textContent = 'Skopiowano. Otwórz ten link na drugim urządzeniu (zawiera token – nie wysyłaj go nikomu).';
          } catch {
            msg.replaceChildren(el('input', { class: 'field', readonly: '', value: link, 'aria-label': 'Link konfiguracyjny' }));
          }
        },
      },
    });
    const off = el('button', {
      class: 'btn', type: 'button', text: 'Rozłącz',
      on: { click: () => { sync = null; syncInfo = null; saveSync(); renderSync(); } },
    });
    box.replaceChildren(head, el('p', { class: 'hint', text: status }), el('div', { class: 'actions' }, [copy, off]), msg);
  };

  // ---- pojedyncze odcinki z linku ----
  const videoId = (s) => {
    const m = s.trim().match(/(?:youtu\.be\/|[?&]v=|\/(?:live|shorts|embed)\/)([\w-]{11})/) || s.trim().match(/^([\w-]{11})$/);
    return m ? m[1] : null;
  };

  const removeExtra = (id) => {
    state.extras[id] = { ...state.extras[id], removed: true, t: Date.now() };
    changed(1500);
    renderSettings();
    render();
  };

  $('addForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = $('addMsg');
    const id = videoId($('addUrl').value);
    if (!id) { msg.textContent = 'To nie wygląda na link do filmu z YouTube.'; return; }
    const existing = episodes().find((e) => e.id === id);
    if (existing) {
      const tab = TABS.find((t) => t.id === statusOf(existing));
      msg.textContent = `Ten odcinek już jest na liście (${tab.name}).`;
      return;
    }
    msg.textContent = 'Dodaję…';
    try {
      const r = await fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent('https://www.youtube.com/watch?v=' + id)}`);
      if (!r.ok) throw new Error(r.status);
      const o = await r.json();
      const now = Date.now();
      state.extras[id] = { title: o.title, author: o.author_name, added: now, t: now };
      delete state.marks[id];
      delete state.pos[id];
      state.t[id] = now;
      state.tab = 'new';
      $('addUrl').value = '';
      msg.textContent = 'Dodano: ' + o.title;
      changed(1500);
      renderSettings();
      render();
    } catch {
      msg.textContent = 'Nie udało się pobrać danych filmu. Sprawdź, czy link jest poprawny i film jest publiczny.';
    }
  });

  $('minMin').addEventListener('change', (ev) => {
    const n = Number(ev.target.value);
    state.minMin = Number.isFinite(n) && n >= 0 ? n : 0;
    state.settingsT = Date.now();
    changed(1500);
    render();
  });
  $('nowDone').addEventListener('click', () => {
    const id = current;
    if (player && player.stopVideo) player.stopVideo();
    current = null;
    $('player').classList.remove('on');
    if (id) setMark(id, 'done');
  });
  $('nowClose').addEventListener('click', closePlayer);

  // Na szerokim ekranie panel kanałów jest od razu rozwinięty
  if (window.matchMedia('(min-width: 860px)').matches) $('settings').open = true;

  // Link konfiguracyjny z innego urządzenia: ...#sync=TOKEN
  if (location.hash.startsWith('#sync=')) {
    const token = decodeURIComponent(location.hash.slice(6));
    history.replaceState(null, '', location.pathname + location.search);
    if (token) { sync = { token }; saveSync(); $('settings').open = true; }
  }

  render();
  renderSync();
  runSync();
  fetch('data/episodes.json', { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
    .then((json) => {
      loaded = true;
      data = { updatedAt: json.updatedAt, channels: json.channels || [], episodes: json.episodes || [] };
      renderSettings();
      render();
    })
    .catch(() => {
      $('end').replaceChildren(
        el('strong', { text: 'Nie udało się wczytać odcinków' }),
        el('p', { class: 'meta', text: 'Odśwież stronę za chwilę.' }),
      );
    });
})();
</script>
</body>
</html>
